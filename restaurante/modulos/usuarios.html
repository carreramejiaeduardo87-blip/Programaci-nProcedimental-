<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" 
    href="../../restaurante/css/usuarios.css">
    <script src="../../restaurante/js/usuarios.js"></script>
    <title>usuarios</title>
</head>

<body>
    <div class="box">
        <article class="media">
            <div class="media-content">
                <div class="content">

                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input id="nombre" class="input" type="text" placeholder="maradona">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">APELLIDO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="apellido" class="input is-success" type="text" placeholder="Text input" value="mesias">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success"> invalido</p>
                    </div>

                    <div class="field">
                        <label class="label">TIPO DE DOCUMENTO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="tipo_documento" class="input is-success" type="text" placeholder="text Input" value="aaaa">
                            <span class="icon is-small is-left">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-exclamation-triangle"></i>
                            </span>
                        </div>
                        <p class="help is-success"> invalido</p>
                    </div>

                    <div class="field">
                        <label class="label"># DE DOCUMENTO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="num_documento" class="input is-success" type="number" placeholder="number input" value="########">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">TELEFONO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="telefono" class="input is-success" type="number" placeholder="number input" value="423633">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success">nUM como stiven hokings</p>
                    </div>

                    <div class="field">
                        <label class="label">correo electronico</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="correo" class="input is-success" type="email" placeholder="email input" value="comosea@gmail.com">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success">este valor es
                            invalido
                        </p>
                    </div>

                    <div class="field">
                        <label class="label">genero</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="genero" class="input is-success" type="text" placeholder="text input" value="macho o hembra">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success">genero invalida</p>
                    </div>

                    <div class="field">
                        <label class="label">cargo</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="cargo" class="input is-success" type="text" placeholder="text input" value="empleado">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success">cargo invalida</p>
                    </div>

                    <div class="field">
                        <label class="label">fecha de nacimiento</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="fecha_nacimiento" class="input is-success" type="date" placeholder="date input" value="dd/mm/aaaa">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success">invalida</p>
                    </div>


                    <div class="field">
                        <label class="label">contraseña</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="contraseña" class="input is-success" type="password" placeholder="password input" value="xxxxxx">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                        <p class="help is-success"> invalida</p>
                    </div>

                </div>
                <nav class="level is-mobile">
                    <div class="level-left">
                        <a class="level-item" aria-label="reply">
                            <span class="icon is-small">
                                <i class="fas fa-reply" aria-hidden="true"></i>
                            </span>
                        </a>
                        <a class="level-item" aria-label="retweet">
                            <span class="icon is-small">
                                <i class="fas fa-retweet" aria-hidden="true"></i>
                            </span>
                        </a>
                        <a class="level-item" aria-label="like">
                            <span class="icon is-small">
                                <i class="fas fa-heart" aria-hidden="true"></i>
                            </span>
                        </a>
                    </div>
                </nav>
                
                <a href="/Programaci-nProcedimental-/restaurante/index.html"><button class="button">volver al inicio</button></a>
                <button class="button" id="guardar">guardar</button>
            </div>
        </article>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/usuarios.js"></script>
</body>

</html>
